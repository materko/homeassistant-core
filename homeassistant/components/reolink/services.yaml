# Describes the format for available reolink services

ptz_move:
  target:
    entity:
      integration: reolink
      domain: button
      supported_features:
        - camera.CameraEntityFeature.STREAM
  fields:
    speed:
      required: true
      default: 10
      selector:
        number:
          min: 1
          max: 64
          step: 1

vod_link:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: reolink
    timestamp:
      selector:
        datetime:
    pre_roll:
      default: 0
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: s
    stream:
      default: sub
      selector:
        select:
          options:
            - sub
            - main

play_chime:
  fields:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            integration: reolink
            model: "Reolink Chime"
    ringtone:
      required: true
      selector:
        select:
          translation_key: ringtone
          options:
            - citybird
            - originaltune
            - pianokey
            - loop
            - attraction
            - hophop
            - goodday
            - operetta
            - moonlight
            - waybackhome
